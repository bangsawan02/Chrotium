name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.configuration-cache=true"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for scripts
      run: |
        chmod +x build_manual_sdk.sh
        if [ -f gradlew ]; then chmod +x gradlew; fi

    - name: Setup Android SDK Environment
      run: |
        echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> $GITHUB_ENV
        echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> $GITHUB_ENV

    - name: Restore Keystore Files
      run: |
        if [ -f my-upload-key.jks.base64 ]; then
          base64 -d my-upload-key.jks.base64 > my-upload-key.jks
        fi

        if [ ! -f my-upload-key.jks ] || ! keytool -list -keystore my-upload-key.jks -storepass android -alias upload > /dev/null 2>&1; then
          rm -f my-upload-key.jks
          keytool -genkey -v -keystore my-upload-key.jks -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Upload,O=Android,C=US"
        fi

        if [ ! -f debug.keystore ]; then
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
        fi

        if [ -f .env.example ] && [ ! -f .env ]; then
          cp .env.example .env
        fi

    - name: Build APK via Manual SDK Toolchain (AAPT2 + D8 + Zipalign + Apksigner)
      run: ./build_manual_sdk.sh

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: chrotium-release-apk
        path: |
          Chrotium.apk
          Chrotium-SDK-Manual.apk
          app/build/outputs/apk/release/*.apk
        if-no-files-found: warn
