name: Build & Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 🚀 Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: 🔑 Configure Release Keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEY_BASE64" ]; then
            echo "Using custom release keystore from secrets..."
            echo "$SIGNING_KEY_BASE64" | base64 --decode > release-custom.jks
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release-custom.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.KEY_STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "Using built-in testing release keystore (release-test.jks)..."
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release-test.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=androidtest" >> $GITHUB_ENV
            echo "KEY_ALIAS=testrelease" >> $GITHUB_ENV
            echo "KEY_PASSWORD=androidtest" >> $GITHUB_ENV
          fi

      - name: 🛠️ Ensure Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper
          fi
          chmod +x ./gradlew

      - name: 📦 Build Minified Release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: 📊 Display APK Information
        run: |
          echo "=== RELEASE ARTIFACTS ==="
          ls -lh app/build/outputs/apk/release/ || true
          
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk Crotium-Browser-Release.apk
            echo "APK Size:"
            du -h Crotium-Browser-Release.apk
          fi

      - name: 📤 Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Crotium-Browser-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: 🏷️ Publish GitHub Release (on tags or manual trigger)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Crotium-Browser-Release.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

